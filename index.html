<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121b">
  <meta name="description" content="A modern two-player 6 by 6 Tic Tac Toe game. Get four symbols in a row to win.">
  <title>6×6 Tic Tac Toe — Play a quick match</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#10121b;--panel:#191c29;--panel2:#202436;--line:#30364a;--muted:#969db2;--text:#f5f6fb;--cyan:#62e6d2;--pink:#ff7da8;--gold:#f6cf73}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:radial-gradient(ellipse at 15% 10%,#20333a 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#30213a 0,transparent 35%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
    .app{width:min(100%,590px)}
    header{text-align:center;margin-bottom:22px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #394253;border-radius:999px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
    .dot{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan)}
    h1{font:700 clamp(34px,7vw,49px)/1.05 'Space Grotesk',sans-serif;letter-spacing:-2.5px;margin:15px 0 7px}
    h1 span{color:var(--cyan)}.subtitle{color:var(--muted);font-size:14px;margin:0}
    .panel{background:linear-gradient(145deg,rgba(31,35,51,.97),rgba(23,26,39,.97));border:1px solid #34394d;border-radius:25px;padding:clamp(14px,3.5vw,22px);box-shadow:0 24px 70px #0006}
    .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:14px}
    .score{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px 14px;text-align:center;transition:border-color .2s,transform .2s}
    .score.active{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 5px 20px #62e6d21a}
    .score:last-child.active{border-color:var(--pink);box-shadow:0 5px 20px #ff7da81a}
    .player{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
    .symbol{font:700 20px 'Space Grotesk';margin:2px 0}
    .score:first-child .symbol{color:var(--cyan)}.score:last-child .symbol{color:var(--pink)}
    .points{font:700 23px 'Space Grotesk'}.versus{font-size:11px;font-weight:800;letter-spacing:1px;color:#727b92}
    .status{min-height:30px;display:flex;justify-content:center;align-items:center;text-align:center;margin:0 0 12px;color:#d9deeb;font-weight:600;font-size:14px}
    .status strong{color:var(--cyan)}.status .o{color:var(--pink)}
    .board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(4px,1.2vw,9px);width:100%;touch-action:manipulation}
    .cell{aspect-ratio:1;min-width:0;border:1px solid #3a4055;border-radius:clamp(5px,1.8vw,12px);background:linear-gradient(145deg,#252a3d,#1d2232);color:var(--text);font:700 clamp(18px,5vw,34px)/1 'Space Grotesk';cursor:pointer;display:grid;place-items:center;padding:0;transition:background .16s,border-color .16s,transform .16s;-webkit-tap-highlight-color:transparent}
    .cell:hover:not(:disabled){background:#2b3448;border-color:#68748f;transform:translateY(-1px)}
    .cell:focus-visible,.action:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .cell.x{color:var(--cyan)}.cell.o{color:var(--pink)}
    .cell.winner{background:#31423f;border-color:var(--gold);box-shadow:inset 0 0 15px #62e6d21c}
    .cell:disabled{cursor:default}
    .actions{display:flex;gap:10px;margin-top:16px}
    .action{border:0;border-radius:13px;padding:12px 16px;font:700 13px 'DM Sans';cursor:pointer;transition:transform .15s,filter .15s}
    .action:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .primary{flex:1;background:var(--cyan);color:#10201e}.secondary{background:#2a3042;color:#e7eaf3;border:1px solid #42495f}
    .powers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .power{background:#292d40;color:#f5f6fb;border:1px solid #454c65;display:flex;flex-direction:column;gap:3px;align-items:center}
    .power span{font-size:10px;color:#aeb5c9;font-weight:600}
    .power:disabled{opacity:.38;cursor:not-allowed;transform:none;filter:none}
    .power.selected{border-color:var(--gold);box-shadow:0 0 0 2px #f6cf7333}
    .power-help{text-align:center;min-height:18px;color:var(--gold);font-size:12px;margin:8px 0 0}
    .hint{text-align:center;color:#7f879d;font-size:12px;margin:13px 0 0}
    footer{text-align:center;color:#70788e;font-size:11px;margin-top:16px}
    @media(max-width:390px){.powers{gap:6px}.power{padding:10px 6px}.scoreboard{gap:8px}.score{padding:9px 7px}.board{gap:4px}.cell{border-radius:5px}.actions{gap:7px}.action{padding:11px 10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow"><span class="dot"></span> Two player game · 6 × 6</div>
      <h1>TIC <span>TAC</span> TOE</h1>
      <p class="subtitle">A bigger board. A bigger challenge.</p>
    </header>
    <section class="panel" aria-label="6 by 6 Tic Tac Toe game">
      <div class="scoreboard" aria-label="Score">
        <div class="score active" id="scoreX"><div class="player">Player one</div><div class="symbol">👑</div><div class="points" id="pointsX">0</div></div>
        <div class="versus">VS</div>
        <div class="score" id="scoreO"><div class="player">Player two</div><div class="symbol">🐉</div><div class="points" id="pointsO">0</div></div>
      </div>
      <p class="status" id="status" aria-live="polite"><strong>👑 King</strong> — your turn</p>
      <div class="board" id="board" role="group" aria-label="6 row by 6 column game board"></div>
      <div class="powers" aria-label="Special powers">
        <button class="action power fire" id="firePower">🔥 Dragon Fire <span id="fireCount">1 left</span></button>
        <button class="action power portal" id="portalPower">🌀 Magic Portal <span id="portalCount">1 left</span></button>
      </div>
      <p class="power-help" id="powerHelp" aria-live="polite">Each player can use each power once per round.</p>
      <div class="actions">
        <button class="action primary" id="restart">↻ &nbsp; Restart round</button>
        <button class="action secondary" id="reset">Reset scores</button>
      </div>
      <p class="hint">Take turns placing 👑 and 🐉. Get 4 in a row horizontally, vertically or diagonally to win.</p>
    </section>
    <footer>MADE FOR FRIENDLY COMPETITION</footer>
  </main>
  <script>
    const SIZE=6,TARGET=4;
    const boardElement=document.getElementById('board');
    const statusElement=document.getElementById('status');
    const scoreX=document.getElementById('pointsX'),scoreO=document.getElementById('pointsO');
    const powerHelp=document.getElementById('powerHelp');
    const cells=[];
    let board=Array(SIZE*SIZE).fill(''),turn='X',active=true,scores={X:0,O:0};
    let fireUsed={X:false,O:false},portalUsed={X:false,O:false};
    let mode=null,portalFirst=null;
    const symbol=p=>p==='X'?'👑':'🐉';
    const playerName=p=>p==='X'?'King':'Dragon';
    for(let i=0;i<36;i++){
      const cell=document.createElement('button');cell.type='button';cell.className='cell';cell.dataset.index=i;
      cell.setAttribute('aria-label',`Row ${Math.floor(i/6)+1}, column ${i%6+1}, empty`);
      cell.addEventListener('click',()=>handleCell(i));boardElement.appendChild(cell);cells.push(cell);
    }
    function setStatus(message){statusElement.innerHTML=message;}
    function updateScores(){
      scoreX.textContent=scores.X;scoreO.textContent=scores.O;
      document.getElementById('scoreX').classList.toggle('active',active&&turn==='X');
      document.getElementById('scoreO').classList.toggle('active',active&&turn==='O');
      document.getElementById('fireCount').textContent=fireUsed[turn]?'used':'1 left';
      document.getElementById('portalCount').textContent=portalUsed[turn]?'used':'1 left';
      document.getElementById('firePower').disabled=!active||fireUsed[turn];
      document.getElementById('portalPower').disabled=!active||portalUsed[turn];
    }
    function render(){
      cells.forEach((cell,i)=>{
        const p=board[i];cell.textContent=p?symbol(p):'';
        cell.className='cell'+(p?' '+p.toLowerCase():'');
        cell.disabled=!active|| (!!p && !mode);
        cell.setAttribute('aria-label',`Row ${Math.floor(i/6)+1}, column ${i%6+1}, ${p?playerName(p)+' '+symbol(p):'empty'}`);
      });
      updateScores();
    }
    function findWinningLines(){
      const lines=[];
      for(let r=0;r<6;r++)for(let c=0;c<6;c++){
        const p=board[r*6+c];if(!p)continue;
        for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
          const rr=r+3*dr,cc=c+3*dc;
          if(rr<0||rr>=6||cc<0||cc>=6)continue;
          const line=[0,1,2,3].map(n=>(r+n*dr)*6+c+n*dc);
          if(line.every(i=>board[i]===p))lines.push({player:p,line});
        }
      }
      return lines;
    }
    function finishIfWon(){
      const wins=findWinningLines();
      if(!wins.length)return false;
      active=false;mode=null;portalFirst=null;
      const winners=[...new Set(wins.map(w=>w.player))];
      wins.forEach(w=>w.line.forEach(i=>cells[i].classList.add('winner')));
      if(winners.length===2){setStatus('Both kingdoms made four in a row — draw! 🤝');}
      else{const p=winners[0];scores[p]++;setStatus('<strong>'+playerName(p)+' '+symbol(p)+' wins!</strong> 🎉');}
      powerHelp.textContent='Round over — restart to play again.';
      render();cells.forEach(c=>c.disabled=true);return true;
    }
    function passTurn(){
      turn=turn==='X'?'O':'X';
      setStatus('<strong class="'+(turn==='O'?'o':'')+'">'+playerName(turn)+' '+symbol(turn)+'</strong> — your turn');
      powerHelp.textContent='Each player gets one Fire and one Portal per round.';
      mode=null;portalFirst=null;
      document.getElementById('firePower').classList.remove('selected');
      document.getElementById('portalPower').classList.remove('selected');
      render();
    }
    function handleCell(i){
      if(!active)return;
      if(mode==='fire'){
        if(board[i]!== (turn==='X'?'O':'X')){powerHelp.textContent='Choose a cell occupied by your opponent.';return;}
        board[i]='';fireUsed[turn]=true;powerHelp.textContent='🔥 Fire hit! Your turn is over.';
        render();if(!finishIfWon()){if(board.every(v=>!v)){active=false;setStatus("It's a draw! 🤝");render();}else passTurn();}return;
      }
      if(mode==='portal'){
        if(portalFirst===null){portalFirst=i;cells[i].classList.add('winner');powerHelp.textContent='Now choose the second cell to swap.';return;}
        if(portalFirst===i){powerHelp.textContent='Choose a different second cell.';return;}
        [board[portalFirst],board[i]]=[board[i],board[portalFirst]];
        portalUsed[turn]=true;powerHelp.textContent='🌀 Portal activated!';render();
        if(!finishIfWon())passTurn();return;
      }
      if(board[i])return;
      board[i]=turn;render();
      if(finishIfWon())return;
      if(board.every(Boolean)){active=false;setStatus("It's a draw! 🤝");powerHelp.textContent='Round over — restart to play again.';render();return;}
      passTurn();
    }
    document.getElementById('firePower').addEventListener('click',()=>{
      if(!active||fireUsed[turn])return;
      mode=mode==='fire'?null:'fire';portalFirst=null;
      document.getElementById('firePower').classList.toggle('selected',mode==='fire');
      document.getElementById('portalPower').classList.remove('selected');
      powerHelp.textContent=mode==='fire'?'🔥 Select one opponent symbol to burn.':'Power cancelled.';
      render();
    });
    document.getElementById('portalPower').addEventListener('click',()=>{
      if(!active||portalUsed[turn])return;
      mode=mode==='portal'?null:'portal';portalFirst=null;
      document.getElementById('portalPower').classList.toggle('selected',mode==='portal');
      document.getElementById('firePower').classList.remove('selected');
      powerHelp.textContent=mode==='portal'?'🌀 Select two cells to swap (empty cells count too).':'Power cancelled.';
      render();
    });
    function restartRound(){
      board=Array(36).fill('');turn='X';active=true;mode=null;portalFirst=null;
      fireUsed={X:false,O:false};portalUsed={X:false,O:false};
      powerHelp.textContent='Each player can use each power once per round.';
      setStatus('<strong>👑 King</strong> — your turn');render();
    }
    document.getElementById('restart').addEventListener('click',restartRound);
    document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0};restartRound();});
    render();
  </script>
</body>
</html>
