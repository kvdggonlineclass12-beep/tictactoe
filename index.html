<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121b">
  <meta name="description" content="A clean, modern Tic-Tac-Toe game for two players.">
  <title>Tic Tac Toe — Play a quick match</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#10121b;--panel:#191c29;--panel2:#202436;--line:#30364a;--muted:#969db2;--text:#f5f6fb;--cyan:#62e6d2;--pink:#ff7da8;--gold:#f6cf73}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(ellipse at 15% 10%,#20333a 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#30213a 0,transparent 35%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
    .app{width:min(100%,490px)}
    header{text-align:center;margin-bottom:26px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #394253;border-radius:999px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
    .dot{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan)}
    h1{font:700 clamp(36px,8vw,52px)/1.05 'Space Grotesk',sans-serif;letter-spacing:-2.5px;margin:17px 0 8px}
    h1 span{color:var(--cyan)}
    .subtitle{color:var(--muted);font-size:14px;margin:0}
    .panel{background:linear-gradient(145deg,rgba(31,35,51,.97),rgba(23,26,39,.97));border:1px solid #34394d;border-radius:25px;padding:22px;box-shadow:0 24px 70px #0006}
    .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:21px}
    .score{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:center;transition:border-color .2s,transform .2s}
    .score.active{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 5px 20px #62e6d21a}
    .score:last-child.active{border-color:var(--pink);box-shadow:0 5px 20px #ff7da81a}
    .player{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
    .symbol{font:700 22px 'Space Grotesk';margin:4px 0}
    .score:first-child .symbol{color:var(--cyan)}.score:last-child .symbol{color:var(--pink)}
    .points{font:700 25px 'Space Grotesk'}
    .versus{font-size:11px;font-weight:800;letter-spacing:1px;color:#727b92}
    .status{min-height:48px;display:flex;justify-content:center;align-items:center;gap:9px;text-align:center;margin:0 0 17px;color:#d9deeb;font-weight:600;font-size:14px}
    .status strong{color:var(--cyan)}.status .o{color:var(--pink)}
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
    .cell{aspect-ratio:1;border:1px solid #3a4055;border-radius:17px;background:linear-gradient(145deg,#252a3d,#1d2232);color:var(--text);font:700 clamp(42px,12vw,65px)/1 'Space Grotesk';cursor:pointer;display:grid;place-items:center;transition:background .16s,border-color .16s,transform .16s; -webkit-tap-highlight-color:transparent}
    .cell:hover:empty{background:#2b3448;border-color:#68748f;transform:translateY(-2px)}
    .cell:focus-visible,.action:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    .cell.x{color:var(--cyan)}.cell.o{color:var(--pink)}
    .cell.winner{background:#31423f;border-color:var(--cyan);box-shadow:inset 0 0 24px #62e6d21c}
    .cell:disabled{cursor:default}
    .actions{display:flex;gap:10px;margin-top:20px}
    .action{border:0;border-radius:13px;padding:13px 16px;font:700 13px 'DM Sans';cursor:pointer;transition:transform .15s,filter .15s}
    .action:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .primary{flex:1;background:var(--cyan);color:#10201e}
    .secondary{background:#2a3042;color:#e7eaf3;border:1px solid #42495f}
    .hint{text-align:center;color:#7f879d;font-size:12px;margin:18px 0 0}
    footer{text-align:center;color:#70788e;font-size:11px;margin-top:19px}
    @media(max-width:390px){.panel{padding:16px}.board{gap:7px}.cell{border-radius:13px}.scoreboard{gap:8px}.score{padding:10px 8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow"><span class="dot"></span> Two player game</div>
      <h1>TIC <span>TAC</span> TOE</h1>
      <p class="subtitle">Three in a row. One moment of glory.</p>
    </header>
    <section class="panel" aria-label="Tic Tac Toe game">
      <div class="scoreboard" aria-label="Score">
        <div class="score active" id="scoreX">
          <div class="player">Player one</div><div class="symbol">×</div><div class="points" id="pointsX">0</div>
        </div>
        <div class="versus">VS</div>
        <div class="score" id="scoreO">
          <div class="player">Player two</div><div class="symbol">○</div><div class="points" id="pointsO">0</div>
        </div>
      </div>
      <p class="status" id="status" aria-live="polite"><strong>Player X</strong> — your turn</p>
      <div class="board" id="board" role="group" aria-label="Game board">
        <button class="cell" data-index="0" aria-label="Row 1, column 1"></button>
        <button class="cell" data-index="1" aria-label="Row 1, column 2"></button>
        <button class="cell" data-index="2" aria-label="Row 1, column 3"></button>
        <button class="cell" data-index="3" aria-label="Row 2, column 1"></button>
        <button class="cell" data-index="4" aria-label="Row 2, column 2"></button>
        <button class="cell" data-index="5" aria-label="Row 2, column 3"></button>
        <button class="cell" data-index="6" aria-label="Row 3, column 1"></button>
        <button class="cell" data-index="7" aria-label="Row 3, column 2"></button>
        <button class="cell" data-index="8" aria-label="Row 3, column 3"></button>
      </div>
      <div class="actions">
        <button class="action primary" id="restart">↻ &nbsp; Restart round</button>
        <button class="action secondary" id="reset">Reset scores</button>
      </div>
      <p class="hint">Take turns placing X and O. First to get 3 in a row wins.</p>
    </section>
    <footer>MADE FOR FRIENDLY COMPETITION</footer>
  </main>
  <script>
    const cells = [...document.querySelectorAll('.cell')];
    const status = document.getElementById('status');
    const scoreX = document.getElementById('pointsX');
    const scoreO = document.getElementById('pointsO');
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board = Array(9).fill('');
    let turn = 'X';
    let active = true;
    let scores = {X:0,O:0};

    function setStatus(message){ status.innerHTML = message; }
    function updateScores(){
      scoreX.textContent = scores.X;
      scoreO.textContent = scores.O;
      document.getElementById('scoreX').classList.toggle('active',active && turn === 'X');
      document.getElementById('scoreO').classList.toggle('active',active && turn === 'O');
    }
    function winningLine(){
      return wins.find(line => line.every(index => board[index] === turn));
    }
    function play(index){
      if(!active || board[index]) return;
      board[index] = turn;
      const cell = cells[index];
      cell.textContent = turn === 'X' ? '×' : '○';
      cell.classList.add(turn.toLowerCase());
      cell.setAttribute('aria-label', cell.getAttribute('aria-label') + ', ' + turn);
      cell.disabled = true;
      const line = winningLine();
      if(line){
        active = false;
        line.forEach(i => cells[i].classList.add('winner'));
        scores[turn]++;
        setStatus('<strong>Player ' + turn + ' wins!</strong> 🎉');
        updateScores();
        cells.forEach(c => c.disabled = true);
        return;
      }
      if(board.every(Boolean)){
        active = false;
        setStatus("It's a draw! 🤝");
        updateScores();
        return;
      }
      turn = turn === 'X' ? 'O' : 'X';
      setStatus('<strong class="' + (turn === 'O' ? 'o' : '') + '">Player ' + turn + '</strong> — your turn');
      updateScores();
    }
    function restartRound(){
      board = Array(9).fill('');
      turn = 'X';
      active = true;
      cells.forEach((cell,i) => {
        cell.textContent = '';
        cell.disabled = false;
        cell.className = 'cell';
        cell.setAttribute('aria-label','Row ' + (Math.floor(i/3)+1) + ', column ' + (i%3+1));
      });
      setStatus('<strong>Player X</strong> — your turn');
      updateScores();
    }
    cells.forEach(cell => cell.addEventListener('click',() => play(Number(cell.dataset.index))));
    document.getElementById('restart').addEventListener('click',restartRound);
    document.getElementById('reset').addEventListener('click',() => {
      scores = {X:0,O:0};
      restartRound();
    });
    updateScores();
  </script>
</body>
</html>
