<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121b">
  <meta name="description" content="A modern two-player 6 by 6 Tic Tac Toe game. Get four symbols in a row to win.">
  <title>6×6 Tic Tac Toe — Play a quick match</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#10121b;--panel:#191c29;--panel2:#202436;--line:#30364a;--muted:#969db2;--text:#f5f6fb;--cyan:#62e6d2;--pink:#ff7da8;--gold:#f6cf73}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:radial-gradient(ellipse at 15% 10%,#20333a 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#30213a 0,transparent 35%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
    .app{width:min(100%,590px)}
    header{text-align:center;margin-bottom:22px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #394253;border-radius:999px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
    .dot{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan)}
    h1{font:700 clamp(34px,7vw,49px)/1.05 'Space Grotesk',sans-serif;letter-spacing:-2.5px;margin:15px 0 7px}
    h1 span{color:var(--cyan)}.subtitle{color:var(--muted);font-size:14px;margin:0}
    .panel{background:linear-gradient(145deg,rgba(31,35,51,.97),rgba(23,26,39,.97));border:1px solid #34394d;border-radius:25px;padding:clamp(14px,3.5vw,22px);box-shadow:0 24px 70px #0006}
    .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:14px}
    .score{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px 14px;text-align:center;transition:border-color .2s,transform .2s}
    .score.active{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 5px 20px #62e6d21a}
    .score:last-child.active{border-color:var(--pink);box-shadow:0 5px 20px #ff7da81a}
    .player{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
    .symbol{font:700 20px 'Space Grotesk';margin:2px 0}
    .score:first-child .symbol{color:var(--cyan)}.score:last-child .symbol{color:var(--pink)}
    .points{font:700 23px 'Space Grotesk'}.versus{font-size:11px;font-weight:800;letter-spacing:1px;color:#727b92}
    .status{min-height:30px;display:flex;justify-content:center;align-items:center;text-align:center;margin:0 0 12px;color:#d9deeb;font-weight:600;font-size:14px}
    .status strong{color:var(--cyan)}.status .o{color:var(--pink)}
    .board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(4px,1.2vw,9px);width:100%;touch-action:manipulation}
    .cell{aspect-ratio:1;min-width:0;border:1px solid #3a4055;border-radius:clamp(5px,1.8vw,12px);background:linear-gradient(145deg,#252a3d,#1d2232);color:var(--text);font:700 clamp(18px,5vw,34px)/1 'Space Grotesk';cursor:pointer;display:grid;place-items:center;padding:0;transition:background .16s,border-color .16s,transform .16s;-webkit-tap-highlight-color:transparent}
    .cell:hover:not(:disabled){background:#2b3448;border-color:#68748f;transform:translateY(-1px)}
    .cell:focus-visible,.action:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .cell.x{color:var(--cyan)}.cell.o{color:var(--pink)}
    .cell.winner{background:#31423f;border-color:var(--gold);box-shadow:inset 0 0 15px #62e6d21c}
    .cell:disabled{cursor:default}
    .actions{display:flex;gap:10px;margin-top:16px}
    .action{border:0;border-radius:13px;padding:12px 16px;font:700 13px 'DM Sans';cursor:pointer;transition:transform .15s,filter .15s}
    .action:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .primary{flex:1;background:var(--cyan);color:#10201e}.secondary{background:#2a3042;color:#e7eaf3;border:1px solid #42495f}
    .hint{text-align:center;color:#7f879d;font-size:12px;margin:13px 0 0}
    footer{text-align:center;color:#70788e;font-size:11px;margin-top:16px}
    @media(max-width:390px){.scoreboard{gap:8px}.score{padding:9px 7px}.board{gap:4px}.cell{border-radius:5px}.actions{gap:7px}.action{padding:11px 10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow"><span class="dot"></span> Two player game · 6 × 6</div>
      <h1>TIC <span>TAC</span> TOE</h1>
      <p class="subtitle">A bigger board. A bigger challenge.</p>
    </header>
    <section class="panel" aria-label="6 by 6 Tic Tac Toe game">
      <div class="scoreboard" aria-label="Score">
        <div class="score active" id="scoreX"><div class="player">Player one</div><div class="symbol">×</div><div class="points" id="pointsX">0</div></div>
        <div class="versus">VS</div>
        <div class="score" id="scoreO"><div class="player">Player two</div><div class="symbol">○</div><div class="points" id="pointsO">0</div></div>
      </div>
      <p class="status" id="status" aria-live="polite"><strong>Player X</strong> — your turn</p>
      <div class="board" id="board" role="group" aria-label="6 row by 6 column game board"></div>
      <div class="actions">
        <button class="action primary" id="restart">↻ &nbsp; Restart round</button>
        <button class="action secondary" id="reset">Reset scores</button>
      </div>
      <p class="hint">Take turns placing X and O. Get 4 in a row horizontally, vertically or diagonally to win.</p>
    </section>
    <footer>MADE FOR FRIENDLY COMPETITION</footer>
  </main>
  <script>
    const SIZE = 6;
    const TARGET = 4;
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    const scoreX = document.getElementById('pointsX');
    const scoreO = document.getElementById('pointsO');
    const cells = [];
    const directions = [[0,1],[1,0],[1,1],[1,-1]];
    let board = Array(SIZE * SIZE).fill('');
    let turn = 'X';
    let active = true;
    let scores = {X:0,O:0};

    for(let i=0;i<SIZE*SIZE;i++){
      const cell=document.createElement('button');
      cell.type='button';
      cell.className='cell';
      cell.dataset.index=i;
      cell.setAttribute('aria-label','Row '+(Math.floor(i/SIZE)+1)+', column '+(i%SIZE+1)+', empty');
      cell.addEventListener('click',()=>play(i));
      boardElement.appendChild(cell);
      cells.push(cell);
    }

    function setStatus(message){statusElement.innerHTML=message;}
    function updateScores(){
      scoreX.textContent=scores.X;
      scoreO.textContent=scores.O;
      document.getElementById('scoreX').classList.toggle('active',active&&turn==='X');
      document.getElementById('scoreO').classList.toggle('active',active&&turn==='O');
    }
    function getWinningLine(index,player){
      const row=Math.floor(index/SIZE),col=index%SIZE;
      for(const [dr,dc] of directions){
        const line=[index];
        for(const sign of [-1,1]){
          let r=row+dr*sign,c=col+dc*sign;
          while(r>=0&&r<SIZE&&c>=0&&c<SIZE&&board[r*SIZE+c]===player){
            line.push(r*SIZE+c);
            r+=dr*sign;c+=dc*sign;
          }
        }
        if(line.length>=TARGET)return line;
      }
      return null;
    }
    function play(index){
      if(!active||board[index])return;
      board[index]=turn;
      const cell=cells[index];
      cell.textContent=turn==='X'?'×':'○';
      cell.classList.add(turn.toLowerCase());
      cell.setAttribute('aria-label','Row '+(Math.floor(index/SIZE)+1)+', column '+(index%SIZE+1)+', '+turn);
      cell.disabled=true;
      const line=getWinningLine(index,turn);
      if(line){
        active=false;
        line.forEach(i=>cells[i].classList.add('winner'));
        scores[turn]++;
        setStatus('<strong>Player '+turn+' wins!</strong> 🎉');
        cells.forEach(c=>c.disabled=true);
        updateScores();
        return;
      }
      if(board.every(Boolean)){
        active=false;
        setStatus("It's a draw! 🤝");
        updateScores();
        return;
      }
      turn=turn==='X'?'O':'X';
      setStatus('<strong class="'+(turn==='O'?'o':'')+'">Player '+turn+'</strong> — your turn');
      updateScores();
    }
    function restartRound(){
      board=Array(SIZE*SIZE).fill('');
      turn='X';
      active=true;
      cells.forEach((cell,i)=>{
        cell.textContent='';
        cell.disabled=false;
        cell.className='cell';
        cell.setAttribute('aria-label','Row '+(Math.floor(i/SIZE)+1)+', column '+(i%SIZE+1)+', empty');
      });
      setStatus('<strong>Player X</strong> — your turn');
      updateScores();
    }
    document.getElementById('restart').addEventListener('click',restartRound);
    document.getElementById('reset').addEventListener('click',()=>{
      scores={X:0,O:0};
      restartRound();
    });
    updateScores();
  </script>
</body>
</html>
